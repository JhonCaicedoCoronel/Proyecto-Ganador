<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book&Bite - Acceso Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        // Si ya hay sesión iniciada, redirige al admin
        if (sessionStorage.getItem('usuarioLogueado') === 'admin' && sessionStorage.getItem('tenant_id')) {
            window.location.href = '/admin.html';
        }
    </script>
    <style>
        :root {
            --primary: #0a3d62;
            --secondary: #ff6b6b;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1559742811-822873691fc8?w=1600') center/cover; 
            display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-main); 
        }

        .login-box { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px 40px; border-radius: 24px; 
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 400px; 
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .login-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #feca57); border-radius: 24px 24px 0 0;
        }

        .icon-brand { font-size: 40px; margin-bottom: 10px; display: inline-block; }
        .login-box h1 { font-weight: 800; font-size: 26px; margin-bottom: 5px; color: white; letter-spacing: -0.5px; }
        .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; font-weight: 500; }

        .input-wrapper { position: relative; margin-bottom: 25px; }
        input { 
            width: 100%; padding: 16px 20px; border-radius: 12px; border: 1.5px solid rgba(255, 255, 255, 0.1); 
            font-size: 16px; text-align: center; background: rgba(0, 0, 0, 0.2); color: white; 
            transition: 0.3s; letter-spacing: 2px; font-family: 'Poppins', monospace; outline: none;
        }
        input:focus { border-color: var(--secondary); background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1); }
        input::placeholder { color: #64748b; font-weight: 400; letter-spacing: normal; }

        button { 
            background: var(--secondary); color: white; border: none; padding: 16px; width: 100%; 
            border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:hover { background: #fa5252; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3); }
        button:active { transform: scale(0.97); }

        #error-msg { 
            background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); 
            padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-top: 20px; display: none; 
        }

        .back-link { display: block; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .back-link:hover { color: white; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <span class="icon-brand">🔐</span>
        <h1>Portal Administrativo</h1>
        <p>Book&Bite - Acceso Staff Exclusivo</p>
        
        <div class="input-wrapper">
            <input type="password" id="pin" placeholder="Ingresa tu código PIN" onkeypress="if(event.key === 'Enter') login()">
        </div>
        
        <button onclick="login()">
            Ingresar al Sistema
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
        
        <div id="error-msg">PIN incorrecto o local no encontrado.</div>
        
        <a href="/index.html" class="back-link">← Volver a Selección de Franquicia</a>
    </div>

    <script>
        function login() {
            const pin = document.getElementById('pin').value.trim();
            sessionStorage.removeItem('usuarioLogueado');
            sessionStorage.removeItem('tenant_id');
            sessionStorage.removeItem('nombre_local');
            
            let tenantAsignado = null;
            let nombreLocal = "";

            // Aquí se validan los pines para identificar la franquicia en cuestión
            if (pin === 'costeñita2024') {
                tenantAsignado = 'tenant_costenita';
                nombreLocal = 'La Costeñita';
            } else if (pin === 'negroni2024') {
                tenantAsignado = 'tenant_negroni';
                nombreLocal = 'Negroni';
            }

            if (tenantAsignado) {
                // Guarda las credenciales correctas en la sesión
                sessionStorage.setItem('usuarioLogueado', 'admin');
                sessionStorage.setItem('tenant_id', tenantAsignado);
                sessionStorage.setItem('nombre_local', nombreLocal);
                
                // Efecto visual y redirección
                document.querySelector('.login-box').style.opacity = '0.5';
                document.querySelector('.login-box').style.transform = 'scale(0.95)';
                setTimeout(() => {
                    window.location.href = '/admin.html';
                }, 300);
            } else {
                // Muestra mensaje de error
                const errorBox = document.getElementById('error-msg');
                errorBox.style.display = 'block';
                // Añade un pequeño efecto de sacudida
                const loginBox = document.querySelector('.login-box');
                loginBox.style.transform = 'translateX(-10px)';
                setTimeout(() => loginBox.style.transform = 'translateX(10px)', 100);
                setTimeout(() => loginBox.style.transform = 'translateX(0)', 200);
            }
        }
    </script>
</body>
</html>
