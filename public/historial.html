<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas y Despachos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (!sessionStorage.getItem('usuarioLogueado')) {
            window.top.location.href = '/login.html';
        }
    </script>
    <style>
        :root {
            --primary: #0a3d62;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2f3542;
            --text-muted: #747d8c;
            --border: #edf2f7;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); padding: 30px; color: var(--text-main); margin: 0; }
        
        .page-header { margin-bottom: 25px; display: flex; align-items: center; gap: 12px; color: var(--primary); }
        .page-header h1 { font-size: 24px; font-weight: 700; margin: 0; }

        .table-container { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        thead { background: #f8fafc; border-bottom: 2px solid var(--border); }
        th { padding: 18px 20px; color: var(--text-muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; transition: 0.2s; }
        tbody tr:hover td { background: #f8fafc; }
        
        .td-primary { color: var(--text-main); font-weight: 600; font-size: 15px; margin-bottom: 4px; display: block; }
        .td-secondary { color: var(--text-muted); font-size: 13px; display: block; }
        
        /* Badges de Estado */
        .badge { padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
        .badge-success { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
        .badge-payment-card { background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
        .badge-payment-cash { background: #fef7e0; color: #b08d00; border: 1px solid #fde293; }
        .badge-payment-na { background: #f1f3f4; color: #5f6368; border: 1px solid #e8eaed; }
    </style>
</head>
<body>

    <div class="page-header">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
        <h1>Historial de Ventas (Hoy)</h1>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Orden #</th>
                    <th>Cliente</th>
                    <th>Resumen del Pedido</th>
                    <th>Método de Pago</th>
                    <th>Estado de Operación</th>
                </tr>
            </thead>
            <tbody id="tabla-historial">
                <tr><td colspan="5" style="text-align:center; color:#999; padding: 40px; font-size:15px;">Sincronizando registros con Supabase...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();
        const miTenant = sessionStorage.getItem('tenant_id') || 'tenant_costenita';

        socket.on('connect', () => {
            socket.emit('unirse-a-restaurante', miTenant);
            socket.emit('obtener-historial-dia', miTenant);
        });

        socket.on('cargar-historial', (pedidos) => {
            const tabla = document.getElementById('tabla-historial');
            tabla.innerHTML = "";

            if (!pedidos || pedidos.length === 0) {
                tabla.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">No hay registros de ventas facturadas hoy.</td></tr>`;
                return;
            }

            pedidos.forEach(p => {
                let badgePago = "";
                if (p.pago === 'Tarjeta') {
                    badgePago = `<span class="badge badge-payment-card">💳 Tarjeta / Transf.</span>`;
                } else if (p.pago === 'Efectivo') {
                    badgePago = `<span class="badge badge-payment-cash">💵 Efectivo</span>`;
                } else {
                    badgePago = `<span class="badge badge-payment-na">🪑 Reserva (Mesa)</span>`;
                }

                tabla.innerHTML += `
                    <tr>
                        <td><span class="td-primary">#${p.id}</span></td>
                        <td><span class="td-primary">${p.cliente}</span></td>
                        <td>
                            <span class="td-primary" style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.item}">${p.item}</span>
                            <span class="td-secondary">Hora: ${p.hora_registro || 'N/A'}</span>
                        </td>
                        <td>${badgePago}</td>
                        <td><span class="badge badge-success">✓ Entregado</span></td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
