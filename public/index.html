<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book&Bite | Inicio</title>
    
    <!-- ========================================== -->
    <!-- MOTOR PWA: MANIFEST E ICONOS EXTERNOS      -->
    <!-- ========================================== -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/app-icon.png">
    <link rel="apple-touch-icon" href="img/app-icon.png">
    <meta name="theme-color" content="#128293">

    <!-- Tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #128293;
            --bg-gradient: linear-gradient(135deg, #e0f2fe, #ffedd5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .brand-container {
            margin-bottom: 25px;
        }

        .brand-container h1 {
            font-size: 2.5rem;
            color: #1e293b;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .btn-franchise {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease;
        }

        .btn-costenita { background: linear-gradient(to right, #0284c7, #2563eb); }
        .btn-negroni { background: linear-gradient(to right, #ea580c, #dc2626); }

        .btn-franchise:hover { transform: translateY(-3px); }
        
        /* Botón de instalación dinámico (Oculto por defecto) */
        #btn-instalar {
            display: none;
            margin-top: 20px;
            background: #128293;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <!-- Interfaz visual limpia (Solo texto, sin imagen del icono aquí adentro) -->
        <div class="brand-container">
            <h1>Book&Bite</h1>
        </div>
        
        <p class="subtitle">Selecciona tu restaurante para comenzar.</p>

        <a href="quiosco.html?tenant=costenita" class="btn-franchise btn-costenita">🦐 La Costeñita</a>
        <a href="quiosco.html?tenant=negroni" class="btn-franchise btn-negroni">🍣 Negroni</a>

        <!-- Este botón aparecerá si el navegador permite instalar la app -->
        <button id="btn-instalar">⬇️ Instalar App Book&Bite</button>
    </div>

    <!-- ========================================== -->
    <!-- REGISTRO DEL SERVICE WORKER Y BOTÓN PWA    -->
    <!-- ========================================== -->
    <script>
        let eventoInstalacion = null;
        const btnInstalar = document.getElementById('btn-instalar');

        // 1. Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker registrado', reg.scope))
                    .catch(err => console.log('❌ Error en Service Worker:', err));
            });
        }

        // 2. Escuchar evento para permitir instalación (Chrome/Android)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            eventoInstalacion = e;
            btnInstalar.style.display = 'inline-block'; // Mostrar botón de instalación
        });

        // 3. Lógica al hacer clic en instalar
        btnInstalar.addEventListener('click', async () => {
            if (eventoInstalacion) {
                eventoInstalacion.prompt();
                const { outcome } = await eventoInstalacion.userChoice;
                if (outcome === 'accepted') {
                    console.log('Usuario aceptó la instalación');
                    btnInstalar.style.display = 'none';
                }
                eventoInstalacion = null;
            }
        });
    </script>
</body>
</html>
