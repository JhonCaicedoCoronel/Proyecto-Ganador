<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book&Bite | Inicio</title>
    
    <link rel="icon" type="image/png" href="img/app-icon.png">
    <link rel="apple-touch-icon" href="img/app-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de Color (Inspiradas en tu logo) */
        :root {
            --primary: #128293; /* Turquesa Book&Bite */
            --secondary: #F49320; /* Naranja Book&Bite */
            --bg-gradient: linear-gradient(135deg, #e0f2fe, #ffedd5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Efecto Glassmorphism (Cristalizado) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        /* ========================================== */
        /* ESTILOS DEL ICONO DE LA APP (HEADER)       */
        /* ========================================== */
        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .app-icon-nav {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 14px; /* Borde curvo tipo iOS */
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15); /* Sombra flotante */
            transition: transform 0.3s ease;
        }

        .app-icon-nav:hover {
            transform: scale(1.05); /* Efecto interactivo al pasar el mouse */
        }

        .brand-container h1 {
            font-size: 2.2rem;
            color: #1e293b;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        /* Botones de Franquicias */
        .btn-franchise {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-costenita {
            background: linear-gradient(to right, #0284c7, #2563eb);
        }

        .btn-negroni {
            background: linear-gradient(to right, #ea580c, #dc2626);
        }

        .btn-franchise:hover {
            opacity: 0.95;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .admin-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .admin-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="brand-container">
            <img src="img/app-icon.png" alt="Book&Bite App" class="app-icon-nav">
            <h1>Book&Bite</h1>
        </div>
        
        <p class="subtitle">Selecciona tu restaurante para comenzar tu reserva o pedido.</p>

        <a href="quiosco.html?tenant=costenita" class="btn-franchise btn-costenita">
            🦐 La Costeñita
        </a>
        <a href="quiosco.html?tenant=negroni" class="btn-franchise btn-negroni">
            🍣 Negroni
        </a>

        <a href="login.html" class="admin-link">Acceso para Staff ➔</a>
    </div>

</body>
</html>
