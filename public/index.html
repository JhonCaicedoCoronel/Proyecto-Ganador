<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book&Bite | Inicio</title>
    
    <!-- Tipografía Moderna y Profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Paleta de colores Premium */
        :root {
            --primary: #128293;
            --secondary: #F49320;
            --bg-gradient: linear-gradient(135deg, #e0f2fe, #ffedd5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Efecto Glassmorphism (Cristalizado) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        /* Contenedor de la marca solo con texto */
        .brand-container {
            margin-bottom: 10px;
        }

        .brand-container h1 {
            font-size: 2.8rem;
            color: #1e293b;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand-container h1 span {
            color: var(--secondary);
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* Botones de Franquicias (Degradados Premium) */
        .btn-franchise {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-costenita {
            background: linear-gradient(to right, #0284c7, #2563eb);
        }

        .btn-negroni {
            background: linear-gradient(to right, #ea580c, #dc2626);
        }

        .btn-franchise:hover {
            opacity: 0.95;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* Enlace de Administración */
        .admin-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .admin-link:hover {
            color: #0f6c7a;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <!-- Diseño Tipográfico Limpio (Sin imágenes) -->
        <div class="brand-container">
            <h1>Book<span>&</span>Bite</h1>
        </div>
        
        <p class="subtitle">Selecciona tu restaurante para comenzar.</p>

        <!-- Navegación Multi-Franquicia -->
        <a href="quiosco.html?tenant=costenita" class="btn-franchise btn-costenita">🦐 La Costeñita</a>
        <a href="quiosco.html?tenant=negroni" class="btn-franchise btn-negroni">🍣 Negroni</a>

        <!-- Acceso al Staff -->
        <a href="login.html" class="admin-link">Acceso para Staff ➔</a>
    </div>

</body>
</html>
