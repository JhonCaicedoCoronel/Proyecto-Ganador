<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Sala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (!sessionStorage.getItem('usuarioLogueado')) {
            window.top.location.href = '/login.html';
        }
    </script>
    <style>
        :root {
            --bg: #f4f6f8;
            --card: #ffffff;
            --primary: #0a3d62;
            --free: #1dd1a1;
            --busy: #ff6b6b;
            --dirty: #feca57;
            --text-main: #2f3542;
            --text-muted: #747d8c;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text-main); padding: 30px; margin: 0; }
        
        .header-title { margin-bottom: 30px; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .box { 
            background: var(--card); padding: 25px 20px; border-radius: 16px; text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s; position: relative; overflow: hidden;
            border: 1px solid #dfe4ea;
        }
        .box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; transition: 0.3s; }
        
        .box.disponible::before { background: var(--free); }
        .box.ocupada::before { background: var(--busy); }
        .box.sucia::before { background: var(--dirty); }
        
        .box h3 { font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        .box-info { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .box-info p { font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        
        /* Controles rápidos (Reemplazo del Select) */
        .status-controls { display: flex; background: #f1f2f6; border-radius: 12px; padding: 5px; gap: 5px; }
        .btn-status { 
            flex: 1; padding: 10px 5px; border: none; border-radius: 8px; font-family: 'Poppins'; 
            font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-muted); 
            background: transparent; transition: 0.3s; 
        }
        .btn-status:hover { background: rgba(0,0,0,0.05); }
        
        /* Estados Activos */
        .box.disponible .btn-status[data-status="disponible"] { background: white; color: var(--free); box-shadow: 0 2px 10px rgba(29, 209, 161, 0.2); }
        .box.ocupada .btn-status[data-status="ocupada"] { background: white; color: var(--busy); box-shadow: 0 2px 10px rgba(255, 107, 107, 0.2); }
        .box.sucia .btn-status[data-status="sucia"] { background: white; color: #e1b12c; box-shadow: 0 2px 10px rgba(254, 202, 87, 0.2); }

    </style>
</head>
<body>
    <h1 class="header-title">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        Gestión de Sala
    </h1>
    
    <div class="grid" id="mesas-box"></div>
    
    <script>
        const socket = io();
        const miTenant = sessionStorage.getItem('tenant_id');

        socket.on('connect', () => {
            if (miTenant) {
                socket.emit('unirse-a-restaurante', miTenant);
            } else {
                window.top.location.href = '/login.html';
            }
        });

        socket.on('cargar-mesas-inicial', drawMesas); 
        socket.on('mesas-actualizadas', drawMesas);
        
        function drawMesas(mesas) {
            const c = document.getElementById('mesas-box'); 
            c.innerHTML = "";
            mesas.forEach(m => {
                c.innerHTML += `
                    <div class="box ${m.estado}" id="mesa-${m.numero}">
                        <h3>Mesa ${m.numero}</h3>
                        <div class="box-info">
                            <p>📍 ${m.ubicacion}</p>
                            <p>👥 ${m.capacidad} pax.</p>
                        </div>
                        <div class="status-controls">
                            <button class="btn-status" data-status="disponible" onclick="updateMesa(${m.numero}, 'disponible')">🟢 Libre</button>
                            <button class="btn-status" data-status="ocupada" onclick="updateMesa(${m.numero}, 'ocupada')">🔴 Ocupada</button>
                            <button class="btn-status" data-status="sucia" onclick="updateMesa(${m.numero}, 'sucia')">🟡 Sucia</button>
                        </div>
                    </div>`;
            });
        }
        
        function updateMesa(numeroMesa, nuevoEstado) { 
            // Optimistic UI update (cambia visualmente antes de que llegue del server)
            const box = document.getElementById(`mesa-${numeroMesa}`);
            if(box) {
                box.classList.remove('disponible', 'ocupada', 'sucia');
                box.classList.add(nuevoEstado);
            }
            socket.emit('cambiar-estado-mesa', { numero: numeroMesa, estado: nuevoEstado, tenant_id: miTenant }); 
        }
    </script>
</body>
</html>
