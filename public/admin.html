<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Book&Bite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (!sessionStorage.getItem('usuarioLogueado') || sessionStorage.getItem('usuarioLogueado') !== 'admin') {
            window.location.href = '/login.html';
        }
    </script>
    <style>
        :root {
            --primary: #0a3d62;
            --secondary: #ff6b6b;
            --success: #1dd1a1;
            --nav-bg: #0f172a;
            --nav-hover: #1e293b;
            --bg: #f4f6f8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body, html { height: 100vh; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
        
        /* Barra de Navegación Moderna */
        .admin-header { 
            background: var(--nav-bg); height: 75px; display: flex; align-items: center; padding: 0 30px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.15); z-index: 10; position: relative; 
        }
        
        .logo-text { 
            color: white; font-size: 22px; font-weight: 800; margin-right: 40px; letter-spacing: -0.5px; 
            display: flex; align-items: center; gap: 8px;
        }
        .logo-text span { color: var(--secondary); }
        
        .nav-links { display: flex; gap: 8px; height: 100%; align-items: center; }
        .nav-btn { 
            text-decoration: none; color: #94a3b8; font-weight: 600; padding: 10px 18px; border-radius: 12px; 
            transition: 0.3s; font-size: 14px; cursor: pointer; border: none; display: flex; align-items: center; gap: 6px;
        }
        .nav-btn:hover { background: var(--nav-hover); color: white; }
        .nav-btn.activo { background: rgba(255, 107, 107, 0.1); color: var(--secondary); font-weight: 700; }
        
        .btn-quiosco { 
            margin-left: auto; background: transparent; border: 1.5px solid var(--success); 
            color: var(--success); padding: 8px 20px; border-radius: 20px;
        }
        .btn-quiosco:hover { background: var(--success); color: white; box-shadow: 0 4px 15px rgba(29, 209, 161, 0.3); transform: translateY(-2px); }
        
        .btn-logout { 
            background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 12px; 
            font-weight: 600; font-size: 14px; cursor: pointer; margin-left: 15px; transition: 0.3s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-logout:hover { background: #dc2626; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); transform: translateY(-2px); }

        #visor-central { width: 100%; flex-grow: 1; border: none; background: var(--bg); display: block; }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="logo-text">🏢 <span id="nombre-franquicia">ADMIN</span></div>
        <nav class="nav-links">
            <a href="/editor.html" target="visor-central" class="nav-btn activo" onclick="cambiarPestana(this)">🍔 Menú</a>
            <a href="/mesas.html" target="visor-central" class="nav-btn" onclick="cambiarPestana(this)">🪑 Mesas</a>
            <a href="/cocina.html" target="visor-central" class="nav-btn" onclick="cambiarPestana(this)">👨‍🍳 Cocina</a>
            <a href="/historial.html" target="visor-central" class="nav-btn" onclick="cambiarPestana(this)">📈 Ventas</a>
            <a href="/reservas.html" target="visor-central" class="nav-btn" onclick="cambiarPestana(this)">📅 Reservas</a>
        </nav>
        <a href="/quiosco.html" target="_blank" class="nav-btn btn-quiosco">👀 Ver Quiosco</a>
        <button class="btn-logout" onclick="cerrarSesion()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Salir
        </button>
    </header>

    <iframe name="visor-central" id="visor-central" src=""></iframe>

    <script>
        function cambiarPestana(elementoClicado) {
            let botones = document.querySelectorAll('.nav-btn:not(.btn-quiosco)');
            botones.forEach(btn => btn.classList.remove('activo'));
            elementoClicado.classList.add('activo');
        }
        function cerrarSesion() {
            sessionStorage.removeItem('usuarioLogueado');
            sessionStorage.removeItem('tenant_id');
            sessionStorage.removeItem('nombre_local');
            window.location.href = '/login.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            const miTenant = sessionStorage.getItem('tenant_id');
            const nombreLocal = sessionStorage.getItem('nombre_local');
            
            if (nombreLocal) {
                document.getElementById('nombre-franquicia').innerText = nombreLocal.toUpperCase();
            }

            if (miTenant) {
                const btnQuiosco = document.querySelector('.btn-quiosco');
                if (btnQuiosco) { btnQuiosco.href = `/quiosco.html?local=${miTenant}`; }

                const enlaces = document.querySelectorAll('.nav-links a:not(.btn-quiosco)');
                enlaces.forEach(enlace => {
                    const urlBase = enlace.getAttribute('href');
                    enlace.setAttribute('href', `${urlBase}?local=${miTenant}`);
                });

                document.getElementById('visor-central').src = `/editor.html?local=${miTenant}`;
            } else {
                cerrarSesion();
            }
        });
    </script>
</body>
</html>
