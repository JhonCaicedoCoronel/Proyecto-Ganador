<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (!sessionStorage.getItem('usuarioLogueado')) {
            window.top.location.href = '/login.html';
        }
    </script>
    <style>
        :root {
            --primary: #0a3d62;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2f3542;
            --text-muted: #747d8c;
            --border: #edf2f7;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); padding: 30px; color: var(--text-main); margin: 0; }
        
        .page-header { margin-bottom: 25px; display: flex; align-items: center; gap: 12px; color: var(--primary); }
        .page-header h1 { font-size: 24px; font-weight: 700; margin: 0; }

        .table-container { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        thead { background: #f8fafc; border-bottom: 2px solid var(--border); }
        th { padding: 18px 20px; color: var(--text-muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; transition: 0.2s; }
        tbody tr:hover td { background: #f8fafc; }
        
        .td-primary { color: var(--text-main); font-weight: 600; font-size: 15px; margin-bottom: 4px; display: block; }
        .td-secondary { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 5px; }
        
        /* Badges de Estado Modernos */
        .badge { padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
        .badge-activa { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
        .badge-comiendo { background: #fef7e0; color: #b08d00; border: 1px solid #fde293; }
        .badge-final { background: #f1f3f4; color: #5f6368; border: 1px solid #e8eaed; }
        
        .btn-salida { 
            background: white; color: #ef4444; border: 1.5px solid #fca5a5; padding: 8px 16px; 
            border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; 
            transition: 0.3s; font-family: 'Poppins'; display: flex; align-items: center; gap: 6px;
        }
        .btn-salida:hover { background: #ef4444; color: white; border-color: #ef4444; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2); }
        
        .txt-completado { color: var(--text-muted); font-size: 13px; font-weight: 500; font-style: italic; }
    </style>
</head>
<body>

    <div class="page-header">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <h1>Libro de Reservas</h1>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Datos del Cliente</th>
                    <th>Asignación</th>
                    <th>Estado de Reserva</th>
                    <th>Acción Operativa</th>
                </tr>
            </thead>
            <tbody id="tabla-reservas">
                <tr><td colspan="5" style="text-align:center; color:#999; padding:40px; font-size:15px;">Sincronizando reservas con la nube...</td></tr>
            </tbody>
        </table>
    </div>

   <script>
        const socket = io();
        const miTenant = sessionStorage.getItem('tenant_id') || 'tenant_costenita';

        socket.on('connect', () => {
            socket.emit('unirse-a-restaurante', miTenant);
            socket.emit('obtener-historial-reservas', miTenant);
        });

        socket.on('cargar-historial-reservas', (reservas) => {
            const cuerpoTabla = document.getElementById('tabla-reservas');
            cuerpoTabla.innerHTML = "";

            if (!reservas || reservas.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">Sin registros en el libro de reservas de hoy.</td></tr>`;
                return;
            }

            reservas.forEach(r => {
                let badgeEstado = "";
                let columnaAccion = "";

                if (r.estado === 'activa') {
                    badgeEstado = `<span class="badge badge-activa"><span style="width:6px;height:6px;background:currentColor;border-radius:50%;"></span> En Espera (Turno #${r.turno_sala})</span>`;
                    columnaAccion = `<button class="btn-salida" onclick="desocuparMesa(${r.id})">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                        Marcar Salida
                                     </button>`;
                } else if (r.estado === 'completado') {
                    badgeEstado = `<span class="badge badge-comiendo">🍳 Sirviendo</span>`;
                    columnaAccion = `<button class="btn-salida" onclick="desocuparMesa(${r.id})">Marcar Salida</button>`;
                } else {
                    badgeEstado = `<span class="badge badge-final">✓ Concluida</span>`;
                    columnaAccion = `<span class="txt-completado">Salió a las ${r.hora_salida || '--:--'}</span>`;
                }

                cuerpoTabla.innerHTML += `
                    <tr>
                        <td>
                            <span class="td-primary">${r.fecha}</span>
                            <span class="td-secondary">⏱️ ${r.hora}</span>
                        </td>
                        <td>
                            <span class="td-primary">${r.cliente}</span>
                            <span class="td-secondary">👥 ${r.personas} Personas</span>
                        </td>
                        <td>
                            <span class="td-primary">Mesa #${r.mesa_id || '1'}</span>
                            <span class="td-secondary">📍 ${r.sucursal || 'Principal'}</span>
                        </td>
                        <td>${badgeEstado}</td>
                        <td>${columnaAccion}</td>
                    </tr>
                `;
            });
        });

        function desocuparMesa(idReserva) {
            if (confirm("¿Confirmar que el cliente ha concluido su servicio y se retira del establecimiento?")) {
                socket.emit('marcar-salida-reserva', { id: idReserva, tenant_id: miTenant });
            }
        }
    </script>
</body>
</html>
